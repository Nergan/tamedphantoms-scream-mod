# Значения вида ${...} подставляет задача generateModMetadata из gradle.properties.
modLoader = "javafml"
loaderVersion = "${loader_version_range}"

license = "${mod_license}"
issueTrackerURL = "https://github.com/Nergan/tamedphantoms-scream-mod/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "logo.png"
displayURL = "https://github.com/Nergan/tamedphantoms-scream-mod"
authors = "${mod_authors}"
description = '''
${mod_description}

Phantoms cry in self-defense, in play, under a full moon, and from the spare scream key.
Фантомы кричат в самозащите, в игре, в полнолуние и с незанятой клавиши крика.
'''

[[mixins]]
config = "tamedphantomsscream.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "kotlinforforge"
type = "required"
versionRange = "${kff_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "tamedphantoms"
type = "required"
versionRange = "${tamedphantoms_version_range}"
ordering = "AFTER"
side = "BOTH"
